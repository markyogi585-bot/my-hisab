name: my_hisab
description: "My Hisab - Premium Personal, Family & Business Money Ledger"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^14.2.0

  # Firebase Cloud & Sync
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0

  # Local Persistence & Offline Sync
  sqflite: ^2.3.3+1
  shared_preferences: ^2.2.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Formatting & Utilities
  intl: ^0.20.3
  uuid: ^4.4.0

  # Media & Receipts
  image_picker: ^1.1.0
  cached_network_image: ^3.3.1

  # Charts & Visuals
  fl_chart: ^0.68.0

  # Export & Share
  pdf: ^3.10.8
  csv: ^6.0.0
  share_plus: ^9.0.0

  # Security & Biometrics
  local_auth: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

