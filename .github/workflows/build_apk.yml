name: Build My Hisab Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🚀 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🐘 Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🛠️ Prepare Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.5 --distribution-type all || true
          chmod +x gradlew || true

      - name: 🧪 Run Unit & Logic Tests
        run: dart test/verification_runner.dart

      - name: 🔨 Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Hisab-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: My Hisab Release v1.0.${{ github.run_number }}
          body: |
            ## 📱 My Hisab - Release APK
            
            Built automatically via GitHub Actions!
            
            ### ✨ Features Included:
            - **Current Balance & Cashflow Dashboard** (₹ 9,00,000 baseline)
            - **Fast Transaction Logging** (+500, +1K, +5K, +10K chips)
            - **Ledger Timeline Grouping** by Date & Daily Totals
            - **Interactive Charts** (Bezier trend & Category donut)
            - **Category Management & Migration**
            - **Export to PDF, CSV, TXT**
            - **Firebase Cloud Sync & Offline-First Persistence**
            - **All Space Members are Admins** (No viewer restrictions)
            - **Local Receipt Storage** (Zero Firebase storage quota needed)
            - **Integer Minor Units (Paise) Precision**
            - **Biometric Lock Support**
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  emulator-test:
    name: Run on Android Emulator
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🚀 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 📱 Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: 🤖 Run on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel
          script: flutter test test/verification_runner.dart
