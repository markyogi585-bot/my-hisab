name: Build My Hisab Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🚀 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🧪 Run Unit & Logic Tests
        run: dart test/verification_runner.dart

      - name: 🔨 Build Release APK
        run: flutter build apk --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Hisab-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: My Hisab Release v1.0.${{ github.run_number }}
          body: |
            ## 📱 My Hisab - Release APK
            
            Built automatically via GitHub Actions!
            
            ### ✨ Features Included:
            - **Current Balance & Cashflow Dashboard** (₹ 9,00,000 baseline)
            - **Fast Transaction Logging** (+500, +1K, +5K, +10K chips)
            - **Ledger Timeline Grouping** by Date & Daily Totals
            - **Interactive Charts** (Bezier trend & Category donut)
            - **Category Management & Migration**
            - **Export to PDF, CSV, TXT**
            - **Firebase Cloud Sync & Offline-First Persistence**
            - **Integer Minor Units (Paise) Precision**
            - **Biometric Lock Support**
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
